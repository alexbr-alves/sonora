<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ff"/>
      <stop offset="0.52" stop-color="#eee9fa"/>
      <stop offset="1" stop-color="#e5dcf8"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6cff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#8d6cff" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
