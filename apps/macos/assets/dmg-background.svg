<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17131f"/>
      <stop offset="0.55" stop-color="#0e1018"/>
      <stop offset="1" stop-color="#181126"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d6cff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#a88cff"/>
      <stop offset="1" stop-color="#8d6cff" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8d6cff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8d6cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
