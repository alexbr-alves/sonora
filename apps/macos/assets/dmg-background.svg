  <path d="M276 206 H365" stroke="#9a78ff" stroke-opacity="0.78" stroke-width="5" stroke-linecap="round"/>
  <path d="M350 190 L369 206 L350 222" fill="none" stroke="#a88cff" stroke-width="5"
